<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Other vs Another Drawing Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; }
    h1 { color: #2e8b57; }
    #scenario { font-size: 20px; margin: 20px; }
    #answer { font-size: 18px; margin: 20px; display: none; }
    #picture { font-size: 40px; margin: 20px; display: none; }
    canvas { border: 2px solid #333; background: #fff; cursor: crosshair; }
    .toolbar { margin: 10px; }
    button {
      padding: 8px 12px; font-size: 16px; margin: 5px;
      background: #2e8b57; color: #fff; border: none;
      border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #4682b4; }
  </style>
</head>
<body>
  <h1>🎮 Other vs Another Drawing Game</h1>
  <button onclick="newScenario()">🎲 New Scenario</button>
  <div id="scenario">Click "New Scenario" to start! (Sentences are hidden)</div>

  <!-- Drawing Board -->
  <div class="toolbar">
    <label>Pen Color:</label>
    <input type="color" id="colorPicker" value="#000000">
    <label>Size:</label>
    <input type="range" id="sizePicker" min="2" max="20" value="4">
    <button onclick="setPen()">✏️ Pen</button>
    <button onclick="setEraser()">🩹 Eraser</button>
    <button onclick="clearCanvas()">🧹 Clear</button>
  </div>
  <canvas id="board" width="600" height="400"></canvas>

  <button onclick="showAnswer()">✅ Finished Drawing</button>
  <button onclick="repeatScenario()">🔁 Read Again</button>
  <div id="answer"></div>
  <div id="picture"></div>

  <script>
    const scenarios = [
      {text:"There is a bird on the tree. It is singing. Another bird is sleeping. Other birds are flying away.", emoji:"🌳🐦🎶 🐦💤 🐦🐦🐦"},
      {text:"One child is sliding down. Another child is climbing. Other children are playing football.", emoji:"👦🛝 👧🧗 ⚽👦👧"},
      {text:"A dog is chasing a ball. Another dog is drinking water. Other dogs are resting under the tree.", emoji:"🐕⚽ 🐕💧 🐕🐕🌳"},
      {text:"A student is reading a book. Another student is writing. Other students are talking quietly.", emoji:"👩‍🎓📖 👨‍🎓✍️ 👩‍🎓👨‍🎓🤫"},
      {text:"One cat is sleeping on the sofa. Another cat is eating. Other cats are looking out of the window.", emoji:"🐈🛋️💤 🐈🍲 🐈🐈🪟"},
      {text:"A man is ordering food. Another man is paying the bill. Other people are eating noodles.", emoji:"👨🍽️ 🧑💵 🍜👩👨"},
      {text:"A child is building a sandcastle. Another child is swimming. Other children are collecting shells.", emoji:"👦🏰 🏊👧 🐚👦👧"},
      {text:"One bird is flying high. Another bird is flying low. Other birds are flying together in a group.", emoji:"🐦⬆️ 🐦⬇️ 🐦🐦🐦"},
      {text:"A woman is buying apples. Another woman is choosing bread. Other shoppers are waiting at the cashier.", emoji:"👩🍎 👩🍞 🛒👨👩"},
      {text:"A boy is reading a comic. Another boy is looking for a dictionary. Other children are sitting quietly.", emoji:"👦📚 👦🔍📖 👧👦🤫"}
    ];

    let currentScenario = null;

    // Speech function
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => v.name.includes("Natural") || v.name.includes("Microsoft") || v.lang === "en-US");
      if (preferredVoice) utterance.voice = preferredVoice;
      speechSynthesis.speak(utterance);
    }

    function newScenario() {
      currentScenario = scenarios[Math.floor(Math.random() * scenarios.length)];
      document.getElementById("scenario").textContent = "🎧 Listen carefully and draw!";
      document.getElementById("answer").style.display = "none";
      document.getElementById("picture").style.display = "none";
      speak(currentScenario.text);
    }

    function repeatScenario() {
      if (currentScenario) speak(currentScenario.text);
    }

    function showAnswer() {
      if (!currentScenario) return;
      document.getElementById("answer").textContent = "Answer: " + currentScenario.text;
      document.getElementById("answer").style.display = "block";
      document.getElementById("picture").textContent = currentScenario.emoji;
      document.getElementById("picture").style.display = "block";
    }

    // Drawing board logic
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    let drawing = false;
    let erasing = false;

    canvas.addEventListener("mousedown", () => { drawing = true; ctx.beginPath(); });
    canvas.addEventListener("mouseup", () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener("mouseout", () => drawing = false);
    canvas.addEventListener("mousemove", draw);

    function draw(e) {
      if (!drawing) return;
      ctx.lineWidth = document.getElementById("sizePicker").value;
      ctx.lineCap = "round";
      ctx.strokeStyle = erasing ? "#fff" : document.getElementById("colorPicker").value;

      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }

    function setEraser() {
      erasing = true;
    }

    function setPen() {
      erasing = false;
    }

    document.getElementById("colorPicker").addEventListener("change", () => erasing = false);
    document.getElementById("sizePicker").addEventListener("change", () => erasing = false);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>
</body>
</html>
