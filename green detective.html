<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Green Detectives</title>
    <style>
      :root{
        --bg:#e6ffef;--card:#fff;--muted:#475569;--accent:#16a34a;--wrong:#ef4444
      }
      *{box-sizing:border-box}
      body{font-family: 'Segoe UI', Roboto, Arial, sans-serif;background:var(--bg);margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
      .app{width:min(960px,100%);background:var(--card);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:18px}
      header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
      h1{margin:0;font-size:1.4rem;color:var(--accent)}
      .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
      .score{font-weight:700;color:var(--muted)}
      .game-area{display:flex;gap:18px;margin-top:14px}
      .cards{flex:1;background:#f8fff8;border-radius:10px;padding:12px;min-height:220px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
      .card{background:#fff;border:2px solid #e6f4ea;border-radius:8px;padding:8px 10px;cursor:grab;user-select:none;touch-action:manipulation;min-width:140px;flex:1 1 calc(50% - 8px)}
      .card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,163,74,.18)}
      .bins{width:320px;display:flex;flex-direction:column;gap:12px}
      .bin{background:linear-gradient(180deg,#ffffff,#f1f8f3);border:2px dashed #cfead8;border-radius:10px;padding:14px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
      .bin.correct{border-color:var(--accent)}
      .bin.wrong{border-color:var(--wrong)}
      .bin h3{margin:0 0 6px 0}
      .meta{display:flex;gap:12px;align-items:center}
      .stars{color:#f59e0b;font-size:1.2rem}
      .hint{color:var(--wrong);font-weight:700;margin-top:8px;min-height:24px}
      .instructions{color:var(--muted);font-size:0.95rem;margin-top:6px}
      .footer{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
      button, select{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:44px;font-size:0.95rem}
      select{background:#fff;color:#111827;border:1px solid #cbd5e1}
      @media (max-width: 700px){
        body{padding:12px;align-items:flex-start}
        .app{padding:14px}
        .game-area{flex-direction:column}
        .bins{width:100%;flex-direction:row;flex-wrap:wrap}
        .bin{flex:1 1 180px}
        .cards{min-height:180px}
        .card{flex:1 1 calc(50% - 6px);min-width:0}
      }
      @media (max-width: 480px){
        h1{font-size:1.2rem}
        .controls{width:100%}
        .controls > *{width:100%}
        .controls select, .controls button{width:100%}
        .card{flex-basis:100%}
      }
    </style>
  </head>
  <body>
    <div class="app" role="application">
      <header>
        <div>
          <h1>🕵️‍♂️ Green Detectives</h1>
          <div style="color:var(--muted);font-size:0.95rem">Sort actions into Green or Non‑Green bins</div>
        </div>

        <div class="controls">
          <div class="score">Stars: <span id="stars">0</span></div>
          <label for="levelSelect" style="font-weight:600;color:var(--muted);">Level</label>
          <select id="levelSelect">
            <option value="1">Level 1 — Text only</option>
            <option value="2">Level 2 — Text + Image</option>
            <option value="3">Level 3 — Timed challenge</option>
          </select>
          <button id="shuffleBtn">Shuffle</button>
          <button id="resetBtn">Reset</button>
          <button id="startTimedBtn" style="display:none;background:#0ea5a4">Start Timed</button>
          <div id="timer" style="font-weight:800;margin-left:8px;color:var(--muted);display:none">Time: <span id="timeLeft">60</span>s</div>
        </div>
      </header>

      <main class="game-area">
        <section class="cards" id="cards" aria-label="Word cards">
          <!-- cards injected here -->
        </section>

        <aside class="bins">
          <div class="bin" id="greenBin" data-category="green" aria-label="Green bin">
            <h3>Green</h3>
            <div>Good for the planet</div>
          </div>

          <div class="bin" id="nonGreenBin" data-category="non-green" aria-label="Non-green bin">
            <h3>Non‑Green</h3>
            <div>Harmful or wasteful</div>
          </div>
        </aside>
      </main>

      <div class="hint" id="hint" aria-live="polite"></div>
      <div class="instructions">On mobile: tap a card, then tap a bin.</div>

      <div class="footer">
        <div style="color:var(--muted)">Correct: <span id="correctCount">0</span> • Incorrect: <span id="incorrectCount">0</span></div>
        <div id="levelInfo" style="color:var(--muted);font-size:0.9rem">Level 1 — Text only</div>
      </div>
    </div>

    <script>
      // Vocabulary from product requirements
      const GREEN = [
        'pick up rubbish',
        'recycle plastic bottles',
        'reuse paper and envelopes',
        'turn the air conditioner down',
        'turn the lights off',
        'use up leftovers'
      ];

      const NON_GREEN = [
        'have a long shower',
        'leave the tap on',
        'throw away cans',
        'use disposable batteries'
      ];

      const allItems = [...GREEN.map(t => ({text:t,cat:'green'})), ...NON_GREEN.map(t=>({text:t,cat:'non-green'}))];

      const cardsEl = document.getElementById('cards');
      const greenBinEl = document.getElementById('greenBin');
      const nonGreenBinEl = document.getElementById('nonGreenBin');
      const hintEl = document.getElementById('hint');
      const starsEl = document.getElementById('stars');
      const correctEl = document.getElementById('correctCount');
      const incorrectEl = document.getElementById('incorrectCount');
      const levelInfoEl = document.getElementById('levelInfo');

      let correct = 0; let incorrect = 0; let stars = 0; let selectedCardEl = null;
      // Timed mode state
      let timedRunning = false;
      let timerInterval = null;
      let timeLeft = 60; // default seconds for timed mode

      function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}

      function clearSelection(){
        if(selectedCardEl){ selectedCardEl.classList.remove('selected'); selectedCardEl = null; }
      }

      function selectCard(cardEl){
        if(selectedCardEl && selectedCardEl !== cardEl) selectedCardEl.classList.remove('selected');
        selectedCardEl = cardEl;
        cardEl.classList.add('selected');
        hintEl.textContent = 'Selected. Now choose a bin.';
        hintEl.style.color = 'var(--muted)';
      }

      function getEmoji(text){
        const map = {
          'pick up rubbish': '🧹',
          'recycle plastic bottles': '♻️',
          'reuse paper and envelopes': '📨',
          'turn the air conditioner down': '❄️',
          'turn the air conditioner off': '🌬️',
          'turn the lights off': '💡',
          'use up leftovers': '🍲',
          'have a long shower': '🚿',
          'leave the tap on': '🚰',
          'throw away cans': '🥫',
          'use disposable batteries': '🔋'
        };
        return map[text] || '🌟';
      }

      function renderCards(){
        clearSelection();
        cardsEl.innerHTML='';
        const level = document.getElementById('levelSelect').value;
        const pool = shuffle([...allItems]);
        pool.forEach((item,idx)=>{
          const el = document.createElement('div');
          el.className='card';
          el.draggable = true;
          el.dataset.idx = idx;
          el.dataset.cat = item.cat;

          if(level === '2'){
            const emoji = document.createElement('div');
            emoji.textContent = getEmoji(item.text);
            emoji.style.fontSize = '3rem';
            emoji.style.textAlign = 'center';
            emoji.style.lineHeight = '1';
            emoji.style.marginBottom = '8px';
            el.appendChild(emoji);
          }

          const t = document.createElement('div');
          t.textContent = item.text;
          t.style.textAlign = 'center';
          t.style.fontWeight = '600';
          t.style.fontSize = '0.95rem';
          t.style.lineHeight = '1.3';
          el.appendChild(t);

          el.addEventListener('dragstart', onDragStart);
          el.addEventListener('click', onCardClick);
          cardsEl.appendChild(el);
        });
      }

      function onCardClick(e){
        e.preventDefault();
        const card = e.currentTarget;
        if(card.classList.contains('selected')){
          clearSelection();
          hintEl.textContent = '';
          return;
        }
        selectCard(card);
      }

      function onDragStart(e){
        const card = e.target.closest('.card');
        if(!card) return;
        e.dataTransfer.setData('text/plain', card.dataset.idx);
        e.dataTransfer.effectAllowed = 'move';
      }

      function onDragOverBin(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; }

      function placeCardInBin(card, binEl){
        if(!card) return;
        const chosenCat = binEl.dataset.category;
        const realCat = card.dataset.cat;

        if(chosenCat === realCat){
          correct += 1; stars += 1;
          card.remove();
          hintEl.textContent = '✅ Correct! Good detective work.';
          hintEl.style.color = 'green';
          playCorrect();
        } else {
          incorrect += 1;
          hintEl.textContent = `❌ Not quite — "${card.textContent}" belongs to ${realCat === 'green' ? 'Green' : 'Non‑Green'}.`;
          hintEl.style.color = 'var(--wrong)';
          playWrong();
        }

        updateStats();
        flashBin(binEl, chosenCat===realCat);
      }

      function onDropBin(e){
        e.preventDefault();
        const idx = e.dataTransfer.getData('text/plain');
        const card = document.querySelector(`.card[data-idx='${idx}']`);
        if(!card) return;
        placeCardInBin(card, e.currentTarget);
        clearSelection();
      }

      function onBinClick(e){
        if(!selectedCardEl){
          hintEl.textContent = 'Tap a card first, then tap a bin.';
          hintEl.style.color = 'var(--wrong)';
          return;
        }
        placeCardInBin(selectedCardEl, e.currentTarget);
        clearSelection();
      }

      function flashBin(binEl, ok){
        binEl.classList.add(ok? 'correct':'wrong');
        setTimeout(()=>binEl.classList.remove(ok? 'correct':'wrong'),700);
      }

      function updateStats(){
        correctEl.textContent = correct;
        incorrectEl.textContent = incorrect;
        starsEl.textContent = stars;
        if(document.querySelectorAll('.card').length===0){
          hintEl.textContent = `All sorted! You earned ${stars} star(s).`;
          hintEl.style.color = 'green';
          if(timedRunning) stopTimedMode();
        }
      }

      // attach bin listeners
      [greenBinEl, nonGreenBinEl].forEach(bin => {
        bin.addEventListener('dragover', onDragOverBin);
        bin.addEventListener('drop', onDropBin);
        bin.addEventListener('click', onBinClick);
      });

      document.getElementById('shuffleBtn').addEventListener('click', ()=>{ renderCards(); hintEl.textContent=''; correct=0; incorrect=0; stars=0; stopTimedMode(); updateStats(); });
      document.getElementById('resetBtn').addEventListener('click', ()=>{ renderCards(); hintEl.textContent=''; correct=0; incorrect=0; stars=0; stopTimedMode(); updateStats(); });

      // --- Sounds (Web Audio API simple tones) ---
      const audioCtx = typeof window.AudioContext !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
      function ensureAudio(){ if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); }
      function playTone(frequency=440,duration=0.12,volume=0.08){
        if(!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = frequency;
        g.gain.value = volume;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        setTimeout(()=>{ o.stop(); }, duration*1000);
      }
      function playCorrect(){ ensureAudio(); playTone(880,0.12,0.06); setTimeout(()=>playTone(1100,0.08,0.04),90); }
      function playWrong(){ ensureAudio(); playTone(220,0.18,0.08); }
      function playClick(){ ensureAudio(); playTone(660,0.06,0.04); }

      // Timed mode controls
      const startTimedBtn = document.getElementById('startTimedBtn');
      const timerEl = document.getElementById('timer');
      const timeLeftEl = document.getElementById('timeLeft');

      function showTimedControls(show){
        startTimedBtn.style.display = show ? 'inline-block' : 'none';
        timerEl.style.display = show ? 'inline-block' : 'none';
      }

      document.getElementById('levelSelect').addEventListener('change', (ev)=>{
        const lvl = ev.target.value;
        if(lvl === '3') showTimedControls(true); else { showTimedControls(false); stopTimedMode(); }
        renderCards(); hintEl.textContent='';
        if(lvl === '1') levelInfoEl.textContent = 'Level 1 — Text only';
        if(lvl === '2') levelInfoEl.textContent = 'Level 2 — Text + Photo';
        if(lvl === '3') levelInfoEl.textContent = 'Level 3 — Timed challenge';
      });

      function startTimedMode(){
        if(timedRunning) return;
        ensureAudio();
        timedRunning = true; timeLeft = 60; timeLeftEl.textContent = timeLeft;
        document.querySelectorAll('.card').forEach(c=>c.draggable = true);
        timerInterval = setInterval(()=>{
          timeLeft -= 1; timeLeftEl.textContent = timeLeft;
          if(timeLeft <= 0){ stopTimedMode(); hintEl.textContent = `Time's up! You earned ${stars} star(s).`; hintEl.style.color='var(--muted)'; }
        },1000);
        playClick();
      }

      function stopTimedMode(){
        timedRunning = false; if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
        document.querySelectorAll('.card').forEach(c=>c.draggable = false);
      }

      startTimedBtn.addEventListener('click', ()=>{ startTimedMode(); });

      // initialize
      renderCards(); updateStats();
    </script>
  </body>
</html>
