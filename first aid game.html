<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Aid Vocabulary Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; }
    h1 { color: #2e8b57; }
    #injury { font-size: 24px; margin: 20px; font-weight: bold; }
    .kit { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .item {
      width: 160px;
      height: 120px;
      margin: 10px;
      border: 2px solid #4682b4;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      font-size: 24px;
    }
    .result { margin-top: 20px; font-size: 20px; font-weight: bold; }
    button { padding: 10px 15px; font-size: 18px; margin: 10px; background: #2e8b57; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4682b4; }
  </style>
</head>
<body>
  <h1>🩹 First Aid Vocabulary Game</h1>
  <button onclick="newRound()">🎲 New Injury</button>
  <div id="injury">Click "New Injury" to start!</div>

  <div class="kit" id="kit"></div>
  <div id="feedback" class="result"></div>

  <script>
    // Injuries with multiple possible treatments
    const injuries = {
      cut: ["plaster", "antiseptic wipe"],
      "broken arm": ["sling"],
      "broken leg": ["bandage"],
      burn: ["running water", "antiseptic cream", "bandage"],  // updated
      "twisted ankle": ["ice pack"],
      bruise: ["ice pack"],
      splinter: ["tweezers", "antiseptic wipe", "plaster"],
      "twisted wrist": ["ice pack", "bandage"],
      "scraped knee": ["antiseptic wipe", "cotton wool ball", "plaster", "bandage"],
      blister: ["plaster", "bandage", "antiseptic wipe"],
      "slammed finger": ["ice pack", "bandage"]
    };

    // Emoji representations of injuries
    const injuryEmojis = {
      cut: "🩸",
      "broken arm": "💪❌",
      "broken leg": "🦵❌",
      burn: "🔥",
      "twisted ankle": "🦶💥",
      bruise: "💜",
      splinter: "✋🌲",
      "twisted wrist": "✋💥",
      "scraped knee": "🦵🩸",
      blister: "🦶🔥",
      "slammed finger": "☝️💥"
    };

    // Emoji representations of first aid kit items
    const items = {
      plaster: {emoji:"🩹", name:"Plaster"},
      bandage: {emoji:"🧻", name:"Bandage"},
      "ice pack": {emoji:"🧊", name:"Ice Pack"},
      "antiseptic cream": {emoji:"🧴", name:"Antiseptic Cream"},
      sling: {emoji:"🪢", name:"Sling"},
      tweezers: {emoji:"✂️", name:"Tweezers"},
      "cotton wool ball": {emoji:"⚪", name:"Cotton Wool Ball"},
      "antiseptic wipe": {emoji:"🧼", name:"Antiseptic Wipe"},
      "running water": {emoji:"🚰", name:"Running Water"}  // new item
    };

    let currentInjury = "";

    function newRound() {
      const keys = Object.keys(injuries);
      currentInjury = keys[Math.floor(Math.random() * keys.length)];
      document.getElementById("injury").innerHTML = 
        "🚑 Injury: " + currentInjury + " " + injuryEmojis[currentInjury];
      document.getElementById("feedback").textContent = "";
      showKit();
    }

    function showKit() {
      const kitDiv = document.getElementById("kit");
      kitDiv.innerHTML = "";
      for (let key in items) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `${items[key].emoji}<br><span>${items[key].name}</span>`;
        div.onclick = () => checkAnswer(key);
        kitDiv.appendChild(div);
      }
    }

    function checkAnswer(choice) {
      const correctAnswers = injuries[currentInjury];
      if (correctAnswers.includes(choice)) {
        document.getElementById("feedback").textContent = "✅ Correct! " + items[choice].name + " can be used for a " + currentInjury + ".";
        document.getElementById("feedback").style.color = "green";
      } else {
        document.getElementById("feedback").textContent = "❌ Not quite. Try again!";
        document.getElementById("feedback").style.color = "red";
      }
    }
  </script>
</body>
</html>
