<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Aid Vocabulary Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; }
    h1 { color: #2e8b57; }
    #injury { font-size: 24px; margin: 20px; font-weight: bold; }
    #injury img { width: 150px; height: auto; display: block; margin: 10px auto; }
    .kit { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .item {
      width: 160px;
      height: 180px;
      margin: 10px;
      border: 2px solid #4682b4;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      padding: 10px;
    }
    .item img {
      width: 90px;
      height: 90px;
      display: block;
      margin: 0 auto 5px;
    }
    .result { margin-top: 20px; font-size: 20px; font-weight: bold; }
    button { padding: 10px 15px; font-size: 18px; margin: 10px; background: #2e8b57; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4682b4; }
  </style>
</head>
<body>
  <h1>🩹 First Aid Vocabulary Game</h1>
  <button onclick="newRound()">🎲 New Injury</button>
  <div id="injury">Click "New Injury" to start!</div>

  <div class="kit" id="kit"></div>
  <div id="feedback" class="result"></div>

  <script>
    // Injuries with correct treatment
    const injuries = {
      cut: "plaster",
      "broken arm": "sling",
      "broken leg": "bandage",
      burn: "antiseptic cream",
      "twisted ankle": "ice pack",
      bruise: "ice pack"
    };

    // Cartoon injury images
    const injuryImages = {
      cut: "https://openclipart.org/download/307308/Cartoon-Cut.png",
      "broken arm": "https://openclipart.org/download/307309/Cartoon-Broken-Arm.png",
      "broken leg": "https://openclipart.org/download/307310/Cartoon-Broken-Leg.png",
      burn: "https://openclipart.org/download/307311/Cartoon-Burn.png",
      "twisted ankle": "https://openclipart.org/download/307312/Cartoon-Twisted-Ankle.png",
      bruise: "https://openclipart.org/download/307313/Cartoon-Bruise.png"
    };

    // Cartoon first aid kit items
    const items = {
      plaster: {img:"https://openclipart.org/download/307314/Cartoon-Plaster.png", name:"Plaster"},
      bandage: {img:"https://openclipart.org/download/307315/Cartoon-Bandage.png", name:"Bandage"},
      "ice pack": {img:"https://openclipart.org/download/307316/Cartoon-Ice-Pack.png", name:"Ice Pack"},
      "antiseptic cream": {img:"https://openclipart.org/download/307317/Cartoon-Antiseptic-Cream.png", name:"Antiseptic Cream"},
      sling: {img:"https://openclipart.org/download/307318/Cartoon-Sling.png", name:"Sling"},
      tweezers: {img:"https://openclipart.org/download/307319/Cartoon-Tweezers.png", name:"Tweezers"},
      "cotton wool ball": {img:"https://openclipart.org/download/307320/Cartoon-Cotton-Wool.png", name:"Cotton Wool Ball"},
      "antiseptic wipe": {img:"https://openclipart.org/download/307321/Cartoon-Antiseptic-Wipe.png", name:"Antiseptic Wipe"},
      alcohol: {img:"https://openclipart.org/download/307322/Cartoon-Alcohol.png", name:"Alcohol"}
    };

    let currentInjury = "";

    function newRound() {
      const keys = Object.keys(injuries);
      currentInjury = keys[Math.floor(Math.random() * keys.length)];
      document.getElementById("injury").innerHTML = 
        "🚑 Injury: " + currentInjury + "<br><img src='" + injuryImages[currentInjury] + "' alt='" + currentInjury + "'>";
      document.getElementById("feedback").textContent = "";
      showKit();
    }

    function showKit() {
      const kitDiv = document.getElementById("kit");
      kitDiv.innerHTML = "";
      for (let key in items) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<img src="${items[key].img}" alt="${items[key].name}"><span>${items[key].name}</span>`;
        div.onclick = () => checkAnswer(key);
        kitDiv.appendChild(div);
      }
    }

    function checkAnswer(choice) {
      const correct = injuries[currentInjury];
      if (choice === correct) {
        document.getElementById("feedback").textContent = "✅ Correct! Use " + items[choice].name + " for a " + currentInjury + ".";
        document.getElementById("feedback").style.color = "green";
      } else {
        document.getElementById("feedback").textContent = "❌ Not quite. Try again!";
        document.getElementById("feedback").style.color = "red";
      }
    }
  </script>
</body>
</html>
