<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hangman Spelling Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; }
    h1 { color: #2e8b57; }
    #wordDisplay { font-size: 32px; letter-spacing: 8px; margin: 20px; }
    #letters { margin: 20px; }
    .letter-btn {
      padding: 10px; margin: 5px; font-size: 18px;
      border: 2px solid #2e8b57; border-radius: 6px;
      background: #fff; cursor: pointer;
    }
    .letter-btn:disabled { background: #ddd; cursor: not-allowed; }
    #message { font-size: 22px; margin-top: 20px; color: #d35400; }
    #inputWords { width: 60%; padding: 10px; font-size: 18px; }
    #startBtn, #nextBtn, #readBtn { padding: 12px 20px; font-size: 20px; margin: 10px; }
    canvas { border: 2px solid #333; margin-top: 20px; background: #fff; }
    #score { font-size: 22px; margin-top: 15px; color: #2e8b57; }
    #difficulty { font-size: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎮 Hangman Spelling Game</h1>

  <!-- Step 1: Input vocabulary -->
  <div id="setup">
    <p>Enter the vocabulary words you want to practice (separate with commas):</p>
    <input type="text" id="inputWords" placeholder="e.g. apple, banana, polar bear">
    <br>
    <label for="difficulty">Choose difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy (10 wrong guesses)</option>
      <option value="medium" selected>Medium (6 wrong guesses)</option>
      <option value="hard">Hard (4 wrong guesses)</option>
    </select>
    <br>
    <button id="startBtn" onclick="startGame()">Start Game</button>
  </div>

  <!-- Step 2: Game area -->
  <div id="game" style="display:none;">
    <canvas id="hangmanCanvas" width="200" height="250"></canvas>
    <div id="wordDisplay"></div>
    <div id="letters"></div>
    <div id="message"></div>
    <div id="score"></div>
    <button id="nextBtn" onclick="nextWord()" style="display:none;">➡️ Next Word</button>
    <button id="readBtn" onclick="readWord()" style="display:none;">🔊 Read Aloud</button>
  </div>

  <script>
    let words = [];
    let currentWord = "";
    let displayWord = [];
    let wrongGuesses = 0;
    let maxGuesses = 6;
    let score = 0;
    let currentIndex = 0;

    const canvas = document.getElementById("hangmanCanvas");
    const ctx = canvas.getContext("2d");

    function startGame(){
      const input = document.getElementById("inputWords").value.trim();
      if(!input){
        alert("Please enter some words first!");
        return;
      }
      words = input.split(",").map(w => w.trim().toLowerCase().replace(/\s+/g,"")); // remove spaces
      currentIndex = 0;
      score = 0;

      // Set difficulty
      const difficulty = document.getElementById("difficulty").value;
      if(difficulty === "easy") maxGuesses = 10;
      else if(difficulty === "medium") maxGuesses = 6;
      else if(difficulty === "hard") maxGuesses = 4;

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "block";
      loadWord();
    }

    function loadWord(){
      currentWord = words[currentIndex];
      displayWord = Array(currentWord.length).fill("_");
      wrongGuesses = 0;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawBase();
      updateDisplay();
      createLetterButtons();
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("readBtn").style.display = "none";
    }

    function updateDisplay(){
      document.getElementById("wordDisplay").textContent = displayWord.join(" ");
      document.getElementById("message").textContent = "Wrong guesses: " + wrongGuesses + "/" + maxGuesses;
      document.getElementById("score").textContent = "Score: " + score;
    }

    function createLetterButtons(){
      const lettersDiv = document.getElementById("letters");
      lettersDiv.innerHTML = "";
      const alphabet = "abcdefghijklmnopqrstuvwxyz";
      for(let char of alphabet){
        const btn = document.createElement("button");
        btn.textContent = char;
        btn.className = "letter-btn";
        btn.onclick = () => guessLetter(char, btn);
        lettersDiv.appendChild(btn);
      }
    }

    function guessLetter(letter, btn){
      btn.disabled = true;
      if(currentWord.includes(letter)){
        for(let i=0; i<currentWord.length; i++){
          if(currentWord[i] === letter){
            displayWord[i] = letter;
          }
        }
      } else {
        wrongGuesses++;
        drawHangman(wrongGuesses);
      }
      updateDisplay();
      checkGameOver();
    }

    function checkGameOver(){
      if(!displayWord.includes("_")){
        document.getElementById("message").textContent = "🎉 Correct! The word was: " + currentWord;
        disableAllButtons();
        score++;
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("readBtn").style.display = "inline-block";
      } else if(wrongGuesses >= maxGuesses){
        document.getElementById("message").textContent = "❌ Game Over! The word was: " + currentWord;
        disableAllButtons();
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("readBtn").style.display = "inline-block";
      }
    }

    function disableAllButtons(){
      const buttons = document.querySelectorAll(".letter-btn");
      buttons.forEach(btn => btn.disabled = true);
    }

    function nextWord(){
      currentIndex++;
      if(currentIndex < words.length){
        loadWord();
      } else {
        document.getElementById("message").textContent = "🏆 All words finished! Final Score: " + score;
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("readBtn").style.display = "none";
      }
    }

    function readWord(){
      const utterance = new SpeechSynthesisUtterance(currentWord);
      speechSynthesis.speak(utterance);
    }

    // Drawing functions
    function drawBase(){
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(10,240); ctx.lineTo(190,240); // base
      ctx.moveTo(50,240); ctx.lineTo(50,20);   // pole
      ctx.lineTo(120,20);                      // top beam
      ctx.lineTo(120,40);                      // rope
      ctx.stroke();
    }

    function drawHangman(step){
      ctx.lineWidth = 2;
      switch(step){
        case 1: // head
          ctx.beginPath();
          ctx.arc(120,60,20,0,Math.PI*2);
          ctx.stroke();
          break;
        case 2: // body
          ctx.beginPath();
          ctx.moveTo(120,80); ctx.lineTo(120,140);
          ctx.stroke();
          break;
        case 3: // left arm
          ctx.beginPath();
          ctx.moveTo(120,100); ctx.lineTo(90,120);
          ctx.stroke();
          break;
        case 4: // right arm
          ctx.beginPath();
          ctx.moveTo(120,100); ctx.lineTo(150,120);
          ctx.stroke();
          break;
        case 5: // left leg
          ctx.beginPath();
          ctx.moveTo(120,140); ctx.lineTo(90,180);
          ctx.stroke();
          break;
        case 6: // right leg
          ctx.beginPath();
          ctx.moveTo(120,140); ctx.lineTo(150,180);
          ctx.stroke();
          break;
      }
    }
  </script>
</body>
</html>
